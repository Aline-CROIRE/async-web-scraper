[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "strict"
asyncio_default_fixture_loop_scope = "function"
# Fail on warnings such as unclosed resources or never-awaited coroutines.
filterwarnings = ["error"]

[tool.coverage.run]
source = ["src"]
branch = true

[tool.coverage.report]
show_missing = true
fail_under = 85
exclude_also = ['if __name__ == "__main__":']

[tool.black]
target-version = ["py311"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # Pyflakes
    "I",     # import sorting
    "B",     # flake8-bugbear
    "C4",    # comprehensions
    "SIM",   # simplifications
    "UP",    # modern Python syntax for the target version
    "ASYNC", # asyncio pitfalls
    "BLE",   # blind except
    "RUF",   # Ruff-specific rules
    "PIE",   # misc. lints
    "PT",    # pytest style
]
ignore = [
    # Request functions take a per-request timeout enforced with
    # asyncio.wait_for, as the assignment requires.
    "ASYNC109",
]

[tool.ruff.lint.per-file-ignores]
# The interactive menu blocks on input() while no other tasks are running.
"src/demo_cli.py" = ["ASYNC250"]
